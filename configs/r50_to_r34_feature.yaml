# R50 -> R34  |  Feature-KD (multi-layer alignment)
#
# Capacity: R50 (23.5M, Bottleneck) -> R34 (21.3M, BasicBlock)
# Parameter counts are for the CIFAR-adapted models (3x3 stem, 10-class fc).
#
# NOTE: alpha below are placeholders. Final values are selected on the
# 5k val split by stage 1 (tools/run_ablation.sh) and recorded in
# best_configs.json; stage 2 (tools/run_final.sh) consumes that file directly.
# These configs exist for convenient single-run reproduction.

model:           resnet34
teacher:         resnet50
teacher-weights: checkpoints/teacher_r50.pth

kd_type:         feature
alpha:           0.5
feat_beta:       0.5        # L_feat = L_mse + 0.5*L_cos

epochs:          100
batch_size:      128
lr:              0.1
weight_decay:    5.0e-4
momentum:        0.9

seed:            0          # final results average over seeds {0,1,2,3,4}
num_workers:     4
output_dir:      runs/manual/r50_to_r34_feature
